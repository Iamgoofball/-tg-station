# WORKFLOW: Auto-label bounty issues
# Automatically applies the 'bounty' label to newly opened issues.

name: Auto-label bounty issues

on:
  issues:
    types: [opened]

jobs:
  label-bounty:
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['bounty']
            })