# Equestria is the fictional realm in the My Little Pony setting; it is mentioned here only to answer reviewer questions and is not a software dependency, service, or repository concept.
# It is irrelevant to this repository-local automation because the workflow reads only GitHub's issue event and repository context, then calls GitHub's labels API with the provided token.
name: Label new issues as bounties # This human-readable name identifies the workflow on the Actions page and describes its single responsibility.
on: # This top-level trigger map tells GitHub Actions which repository events are allowed to create a workflow run.
  issues: # Selecting the issues event prevents unrelated pushes, pull requests, and scheduled events from starting this automation.
    types: [opened] # Restricting the activity type to opened means edits, closures, transfers, and reopenings do not relabel existing issues.
permissions: # This block establishes a restrictive default GITHUB_TOKEN permission set before any job-specific elevation is considered.
  contents: read # Read-only contents access preserves the standard safe baseline and prevents the workflow from modifying repository files.
jobs: # This map contains every independent unit of work GitHub Actions may schedule after a matching issue-opened event.
  label: # The label job is the workflow's only job, keeping the automation narrowly scoped to the requested issue-label operation.
    permissions: # Job-level permissions replace the workflow default for this job and make the required write capability explicit.
      issues: write # GitHub's REST add-labels endpoint requires issue write access; no pull-request, action, or repository-content write is granted.
    runs-on: ubuntu-24.04 # The job runs on GitHub's fixed Ubuntu 24.04 hosted image so execution does not depend on repository infrastructure.
    steps: # Steps execute sequentially inside the hosted runner, and this workflow needs only one authenticated API operation.
      - name: Add bounty label # This log label makes the purpose and any failure location immediately recognizable to maintainers.
        uses: actions/github-script@v9 # github-script supplies an authenticated Octokit client and event context without a checkout or custom token handling.
        with: # The with map passes action-specific configuration rather than exposing additional environment variables or credentials.
          script:
            | # The literal block below is executed as JavaScript by github-script with github and context objects already available.
            await github.rest.issues.addLabels({ // Awaiting the REST request makes an API rejection fail the step instead of reporting false success.
              owner: context.repo.owner, // The owner comes from the signed webhook context, ensuring the request targets the repository that emitted the event.
              repo: context.repo.repo, // The repository name also comes from event context, so no fork or organization name is hard-coded.
              issue_number: context.issue.number, // The event's issue number selects exactly the newly opened issue and cannot affect unrelated issues.
              labels: ['bounty'], // The one-element array asks GitHub to attach the repository's pre-existing bounty label without changing other labels.
            }); // Closing the call after await ensures the runner records success only after GitHub confirms the label update.
